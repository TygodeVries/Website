<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="index.css" />
</head>
<body>
    <h4 class="content-text">Select an audio file.</h4>
    <div class="audio-selector">
        <input class="help-button" type="file" id="clip">
    </div>

    <h4 class="content-text">How many notes per minute?</h4>
    <div class="bpm">
        <input class="help-button" type="number" placeholder="Enter BPM">
    </div>

    <br>
    <button class="exit-button" onclick="load()">Create</button>

    <h1 class="content-text">Editor</h1>
    <div id="editor-section">
        <button id="play-button" class="help-button">Play</button>
        <button id="stop-button" class="help-button">Pause</button>
        <div id="container" style="display: flex;">
            <div id="editor" style="flex: 1;"></div>
            <div id="progress-slider" style="width: 10px; background: #eee; margin-left: 10px;"></div>
        </div>
    </div>

    <br>
    <button class="help-button" onclick="exportFile()">Download as File</button>

    <script src="index.js"></script>
</body>
</html>
